<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activity Log</title>
<meta name="description" content="Activity Log External Relations & Media Communication">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--card:#ffffff;--line:#e9e9e7;--line2:#dcdcd9;
  --tx:#37352f;--tx2:#787774;--tx3:#a5a49f;
  --acc:#2383e2;--acc-bg:#e7f0fb;--red:#e03e3e;--green:#0f9d58;
  --shadow:0 1px 2px rgba(15,15,15,.06),0 4px 16px rgba(15,15,15,.08);
  --t-ER:#0b6e99;--t-ER-bg:#ddebf1;--t-MC:#6940a5;--t-MC-bg:#eae4f2;--t-SM:#ad1a72;--t-SM-bg:#f4dfeb;
  --t-PR:#d9730d;--t-PR-bg:#faebdd;--t-EV:#b8860b;--t-EV-bg:#fbf3db;--t-AD:#64635f;--t-AD-bg:#ebeced;
  --s-p:#787774;--s-p-bg:#ebeced;--s-o:#0b6e99;--s-o-bg:#ddebf1;--s-d:#0f7b6c;--s-d-bg:#ddedea;--s-c:#e03e3e;--s-c-bg:#fbe4e4;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191919;--bg2:#202020;--card:#252525;--line:#2f2f2f;--line2:#3a3a3a;
  --tx:#e6e6e4;--tx2:#9b9b98;--tx3:#6b6b68;
  --acc:#4c9be8;--acc-bg:#1f3347;--red:#ff6b61;--green:#2fb67c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.45);
  --t-ER:#6cb3d4;--t-ER-bg:#1e3542;--t-MC:#a98ad6;--t-MC-bg:#33294a;--t-SM:#e07bb4;--t-SM-bg:#45253a;
  --t-PR:#ec9a50;--t-PR-bg:#47321e;--t-EV:#dcb84b;--t-EV-bg:#433a1d;--t-AD:#a5a49f;--t-AD-bg:#373737;
  --s-p:#a5a49f;--s-p-bg:#373737;--s-o:#6cb3d4;--s-o-bg:#1e3542;--s-d:#4dbb9f;--s-d-bg:#1d3a33;--s-c:#ff7a70;--s-c-bg:#4a2523;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#191919;--bg2:#202020;--card:#252525;--line:#2f2f2f;--line2:#3a3a3a;
  --tx:#e6e6e4;--tx2:#9b9b98;--tx3:#6b6b68;
  --acc:#4c9be8;--acc-bg:#1f3347;--red:#ff6b61;--green:#2fb67c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.45);
  --t-ER:#6cb3d4;--t-ER-bg:#1e3542;--t-MC:#a98ad6;--t-MC-bg:#33294a;--t-SM:#e07bb4;--t-SM-bg:#45253a;
  --t-PR:#ec9a50;--t-PR-bg:#47321e;--t-EV:#dcb84b;--t-EV-bg:#433a1d;--t-AD:#a5a49f;--t-AD-bg:#373737;
  --s-p:#a5a49f;--s-p-bg:#373737;--s-o:#6cb3d4;--s-o-bg:#1e3542;--s-d:#4dbb9f;--s-d-bg:#1d3a33;--s-c:#ff7a70;--s-c-bg:#4a2523;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  padding-bottom:calc(96px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
html.lock,html.lock body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 96%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hrow{display:flex;align-items:center;gap:8px;min-height:52px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:17px;letter-spacing:-.01em}
.ttl small{display:block;color:var(--tx2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-height:44px;min-width:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--card);font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{background:var(--bg2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5}
.per{display:flex;align-items:center;gap:4px;min-height:44px}
.per .arw{width:44px;height:44px;border-radius:8px;font-size:22px;color:var(--tx2)}
.per .arw:active{background:var(--bg2)}
.pick{position:relative;flex:1;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;border-radius:8px}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.tabs{display:flex;gap:2px}
.tabs button{flex:1;min-height:44px;color:var(--tx2);font-weight:500;border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);border-bottom-color:var(--tx)}

/* Toolbar */
.search{display:flex;gap:8px;margin:12px 0 8px}
.search input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line2);border-radius:8px;padding:0 12px;background:var(--bg2);outline:none}
.search input:focus{border-color:var(--acc);background:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:13px;color:var(--tx2);display:inline-flex;align-items:center;gap:6px;position:relative}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip b{font-weight:600;color:var(--tx)}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.chip.on b{color:var(--bg)}

/* Days */
#days{position:relative}
.day{margin:6px 0;border-radius:10px;background:var(--bg)}
.dhead{display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 4px 4px 8px;border-radius:10px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;cursor:pointer}
.dhead:active{background:var(--bg2)}
.dtitle{flex:1;min-width:0}
.dtitle b{font-weight:600}
.dtitle .dl{color:var(--tx2);margin-left:6px}
.dtitle .today{font-size:11px;font-weight:600;color:var(--acc);background:var(--acc-bg);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.dsub{display:flex;align-items:center;gap:4px;color:var(--tx2);font-size:12px;margin-top:1px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.mini{min-height:44px;padding:0 10px;border-radius:8px;color:var(--tx2);font-size:13px}
.mini:active{background:var(--line)}
.dbody{padding:0 0 6px}
.day.closed .dbody{display:none}
.drow{display:flex;gap:6px;margin-top:4px}
.drow .btn{flex:1;font-size:13px;color:var(--tx2)}
.dragmode .dbody{display:none!important}
.dragmode .day{transition:none}
.day.dragging{position:relative;z-index:10}
.day.dragging .dhead{background:var(--card);box-shadow:var(--shadow);outline:1px solid var(--acc)}
.dropline{position:absolute;left:4px;right:4px;height:3px;border-radius:2px;background:var(--acc);pointer-events:none;z-index:9;display:none}
.dropline::before{content:"";position:absolute;left:-4px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--acc)}

/* Swipe card */
.sw{position:relative;margin:6px 0;border-radius:10px;overflow:hidden}
.swa{position:absolute;top:0;bottom:0;width:96px;border:0;color:#fff;font-weight:600;font-size:14px;z-index:1;visibility:hidden}
.swa.del{right:0;background:var(--red)}
.swa.add{left:0;background:var(--green)}
.sw[data-dir=del] .swa.del,.sw[data-dir=add] .swa.add{visibility:visible}
.card{position:relative;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;
  touch-action:pan-y;transition:transform .2s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 4px}
.tag{min-height:32px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:600;letter-spacing:.02em;position:relative}
.tag::after,.st::after{content:"";position:absolute;inset:-6px -2px}
.ch{font-size:12px;color:var(--tx2)}
.st{margin-left:auto;min-height:32px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;position:relative;display:inline-flex;align-items:center;gap:5px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ctext{margin:0;white-space:pre-wrap;word-wrap:break-word}
.card.cx .ctext{color:var(--tx2);text-decoration:line-through;text-decoration-color:var(--tx3)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
.T-ER{color:var(--t-ER);background:var(--t-ER-bg)}.T-MC{color:var(--t-MC);background:var(--t-MC-bg)}
.T-SM{color:var(--t-SM);background:var(--t-SM-bg)}.T-PR{color:var(--t-PR);background:var(--t-PR-bg)}
.T-EV{color:var(--t-EV);background:var(--t-EV-bg)}.T-AD,.T-X{color:var(--t-AD);background:var(--t-AD-bg)}
.S-p{color:var(--s-p);background:var(--s-p-bg)}.S-o{color:var(--s-o);background:var(--s-o-bg)}
.S-d{color:var(--s-d);background:var(--s-d-bg)}.S-c{color:var(--s-c);background:var(--s-c-bg)}
.D-p{background:var(--s-p)}.D-o{background:var(--s-o)}.D-d{background:var(--s-d)}.D-c{background:var(--s-c)}

.empty{text-align:center;color:var(--tx2);padding:48px 16px}
.empty p{margin:0 0 14px}
.foot{display:flex;gap:8px;margin:14px 0}
.foot .btn{flex:1}

/* Contacts & notes */
.sec{margin:16px 0}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);margin:0 0 8px;font-weight:600}
.ct{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}
.ct b{display:block}
.ct small{color:var(--tx2)}
.ct .lk{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.ct .lk a{min-height:36px;display:inline-flex;align-items:center;padding:0 10px;border-radius:6px;background:var(--bg2);color:var(--acc);text-decoration:none;font-size:13px}
textarea.notes{width:100%;min-height:200px;border:1px solid var(--line2);border-radius:10px;padding:12px;background:var(--card);resize:vertical;outline:none}
textarea.notes:focus{border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.hint{color:var(--tx2);font-size:13px;margin:6px 0}

/* FAB */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;
  width:60px;height:60px;border-radius:18px;background:var(--acc);color:#fff;font-size:30px;line-height:1;box-shadow:var(--shadow)}
.fab:active{transform:scale(.96)}

/* Sheet */
.back{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--card);border-radius:16px 16px 0 0;box-shadow:var(--shadow);transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 8px}
.sheet h2{font-size:17px;margin:4px 0 12px}
.f{margin:0 0 14px}
.f>label,.f>.lb{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.f input[type=text],.f input[type=tel],.f input[type=email],.f input[type=date],.f select,.f textarea{width:100%;min-height:44px;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;background:var(--bg);outline:none}
.f textarea{min-height:88px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--acc)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;min-width:52px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);font-weight:500;font-size:14px}
.seg button.on{border-color:currentColor;font-weight:700}
.seg.plain button.on{background:var(--tx);color:var(--bg)}
.tdesc{font-size:13px;color:var(--tx2);margin-top:6px;min-height:19px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:20px;height:20px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:76px;height:76px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ph .x{position:absolute;top:-8px;right:-8px;width:32px;height:32px;border-radius:50%;background:var(--tx);color:var(--bg);font-size:16px;line-height:32px}
.ptile{position:relative;width:76px;height:76px;border:1.5px dashed var(--line2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:13px;font-weight:600;text-align:center}
.ptile input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.perr{color:var(--red);font-size:13px;margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--card);padding:10px 0 calc(16px + env(safe-area-inset-bottom));margin-bottom:calc(-16px - env(safe-area-inset-bottom))}
.acts .btn{flex:1 1 auto}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;
  background:var(--tx);color:var(--bg);border-radius:10px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:8px;
  max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:.2s;font-size:14px;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{padding:8px 4px 8px 0;flex:1}
.toast{min-width:min(300px,calc(100vw - 32px))}
.toast button{min-height:40px;padding:0 12px;border-radius:7px;color:var(--bg);font-weight:700;background:color-mix(in srgb,var(--bg) 18%,transparent)}
.toast button:empty{display:none}

/* Viewer */
.viewer{position:fixed;inset:0;z-index:70;background:#000;display:none;align-items:center;justify-content:center}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vx,.viewer .vp,.viewer .vn{position:absolute;color:#fff;width:48px;height:48px;font-size:26px;border-radius:50%;background:rgba(255,255,255,.12)}
.viewer .vx{top:calc(12px + env(safe-area-inset-top));right:12px}
.viewer .vp{left:10px;top:50%}.viewer .vn{right:10px;top:50%}
.viewer .vc{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));color:#fff;font-size:13px;opacity:.8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="hrow">
      <div class="ttl"><b>Activity Log</b><small id="hname"></small></div>
      <button class="btn" id="pdfBtn" type="button">PDF</button>
    </div>
    <div class="per">
      <button class="arw" id="prevM" type="button" aria-label="Bulan sebelumnya">‹</button>
      <div class="pick"><span id="perLbl"></span><input type="month" id="perIn" aria-label="Pilih periode"></div>
      <button class="arw" id="nextM" type="button" aria-label="Bulan berikutnya">›</button>
    </div>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="log">Log</button>
      <button type="button" data-tab="kontak">Kontak</button>
      <button type="button" data-tab="catatan">Catatan</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="v-log">
    <div class="search">
      <input id="q" type="search" placeholder="Cari aktivitas…" autocomplete="off" enterkeyhint="search">
      <button class="btn" id="copyAll" type="button">Salin semua</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="days"></div>
    <div class="foot" id="logFoot"><button class="btn" id="addDay" type="button">+ Hari</button></div>
  </section>
  <section id="v-kontak" hidden></section>
  <section id="v-catatan" hidden></section>
</main>

<button class="fab" id="fab" type="button" aria-label="Tambah">+</button>
<div class="back" id="back"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="tbtn" type="button"></button></div>
<div class="viewer" id="viewer"><img id="vimg" alt=""><button class="vp" id="vp" type="button">‹</button><button class="vn" id="vn" type="button">›</button><button class="vx" id="vx" type="button" aria-label="Tutup">×</button><div class="vc" id="vc"></div></div>

<script src="jspdf.umd.min.js" defer></script>
<script>
'use strict';
/* ================= Konstanta ================= */
const KEY = 'alog-v1';
const DEFAULT_NAME = "Muhammad Mutawallie Sya'rawie";
const ROLE = 'External Relations & Media Communication';
const TYPES = {ER:'External Relations',MC:'Media Communication',SM:'Social Media Management',PR:'Public Relations & Community Engagement',EV:'Event / Koordinasi',AD:'Administrasi / Koordinasi internal'};
const STATUS = ['Pending','On Progress','Done','Cancelled'];
const SCLS = {'Pending':'p','On Progress':'o','Done':'d','Cancelled':'c'};
const CHANNELS = ['WhatsApp','Email','Luring','Rapat'];
const CH_ALIAS = {wa:'WhatsApp',whatsapp:'WhatsApp',email:'Email','e-mail':'Email',luring:'Luring',offline:'Luring',rapat:'Rapat',meeting:'Rapat'};
const ST_ALIAS = {pending:'Pending','on progress':'On Progress',progress:'On Progress','in progress':'On Progress',onprogress:'On Progress',proses:'On Progress',done:'Done',selesai:'Done',cancelled:'Cancelled',canceled:'Cancelled',batal:'Cancelled'};
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HR = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
// Data awal = salinan data asli per 19 Nov 2026 (dipakai bila belum ada data & untuk "Atur ulang").
const SEED = {"days": [], "contacts": [], "notesM": {}, "prefs": {"type": "MC", "ch": "WhatsApp"}, "period": "2026-11", "name": "Muhammad Mutawallie Sya'rawie", "updated": 0};
const PWA = true;

/* ================= Util ================= */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const curMonth = () => today().slice(0, 7);

const idb = {
  db: null, store: 'p',
  // Toleran terhadap DB foto versi lama: nama store apa pun, key in-line/out-of-line, nilai Blob/dataURL/objek.
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB tidak tersedia di browser ini'));
      const done = db => { db.onversionchange = () => { db.close(); this.db = null; }; this.db = db; res(db); };
      const r = indexedDB.open('alog-photos');
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('p')) r.result.createObjectStore('p'); };
      r.onsuccess = () => {
        const db = r.result; const names = [...db.objectStoreNames];
        if (names.length) { this.store = names.includes('p') ? 'p' : names[0]; return done(db); }
        const v = db.version + 1; db.close();
        const r2 = indexedDB.open('alog-photos', v);
        r2.onupgradeneeded = () => r2.result.createObjectStore('p');
        r2.onsuccess = () => { this.store = 'p'; done(r2.result); };
        r2.onerror = () => rej(r2.error || new Error('IndexedDB gagal dibuka'));
      };
      r.onerror = () => rej(r.error || new Error('IndexedDB gagal dibuka'));
      r.onblocked = () => rej(new Error('IndexedDB terblokir, tutup tab lain'));

  async run(mode, fn) {

  async get(id) { return toBlob(await this.run('readonly', s => s.get(id))); },
  put(id, blob) { return this.run('readwrite', s => s.keyPath ? s.put({[s.keyPath]: id, id, blob}) : s.put(blob, id)); },
  del(id) { return this.run('readwrite', s => s.delete(id)); },

function toBlob(v) {

let lp = null, drag = null;
const LP_MS = 380;
daysEl.addEventListener('contextmenu', e => { if (e.target.closest('.dhead')) e.preventDefault(); });
daysEl.addEventListener('pointerdown', e => {
  const h = e.target.closest('.dhead');
  if (!h || e.target.closest('button') || e.button > 0 || drag) return;
  if (filtering()) return;
  const sec = h.parentElement;
  lp = {h, sec, x: e.clientX, y: e.clientY, pid: e.pointerId, t: setTimeout(() => startDrag(), LP_MS)};
});
window.addEventListener('pointermove', e => {
  if (lp && !drag && e.pointerId === lp.pid) {
    if (Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 8) { clearTimeout(lp.t); lp = null; }
    return;
  }
  if (drag && e.pointerId === drag.pid) { drag.y = e.clientY; dragUpdate(); }
});
function lpEnd(e) {
  if (lp && e.pointerId === lp.pid) { clearTimeout(lp.t); lp = null; }
  if (drag && e.pointerId === drag.pid) endDrag();
}
window.addEventListener('pointerup', lpEnd);
window.addEventListener('pointercancel', lpEnd);
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, {passive: false});

function startDrag() {
  const {h, sec, y, pid} = lp; lp = null;
  if (!sec.isConnected) return;
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
  closeSwipe();
  const before = sec.getBoundingClientRect().top;
  daysEl.classList.add('dragmode'); sec.classList.add('dragging');
  // Jaga agar header tetap di bawah jari setelah semua hari menciut
  const after = sec.getBoundingClientRect().top;
  window.scrollBy(0, after - before);
  try { h.setPointerCapture(pid); } catch (e) {}
  drag = {sec, h, pid, y, y0: y, s0: window.scrollY, idx: -1, raf: 0, line: $('#dropline')};
  drag.line.style.display = 'block';
  dragUpdate();
  const loop = () => {
    if (!drag) return;
    const edge = 72, vh = window.innerHeight;
    let v = 0;
    if (drag.y < edge + 40) v = -Math.ceil((edge + 40 - drag.y) / 6);
    else if (drag.y > vh - edge) v = Math.ceil((drag.y - (vh - edge)) / 6);
    if (v) { window.scrollBy(0, v); dragUpdate(); }
    drag.raf = requestAnimationFrame(loop);
  };
  drag.raf = requestAnimationFrame(loop);
}
function dragUpdate() {
  const {sec, line} = drag;
  const dy = (drag.y - drag.y0) + (window.scrollY - drag.s0);
  sec.style.transform = `translateY(${dy}px)`;
  const others = [...daysEl.querySelectorAll('.day')].filter(x => x !== sec);
  let idx = 0;
  for (const o of others) { const r = o.getBoundingClientRect(); if (drag.y > r.top + r.height / 2) idx++; }
  drag.idx = idx;
  let top;
  if (!others.length) top = sec.offsetTop - 4;
  else if (idx < others.length) top = others[idx].offsetTop - 5;
  else { const l = others[others.length - 1]; top = l.offsetTop + l.offsetHeight + 2; }
  line.style.top = top + 'px';
}
function endDrag() {
  const d = drag; drag = null;
  cancelAnimationFrame(d.raf);
  try { d.h.releasePointerCapture(d.pid); } catch (e) {}
  daysEl.classList.remove('dragmode'); d.sec.classList.remove('dragging'); d.sec.style.transform = '';
  d.line.style.display = 'none';
  suppressUntil = Date.now() + 400;
  const list = periodDays(); const id = d.sec.dataset.day;
  const shownDesc = list.slice().reverse().filter(x => x.id !== id);
  shownDesc.splice(d.idx, 0, findDay(id));
  const order = shownDesc.reverse();
  const changed = order.some((x, i) => x !== list[i]);
  if (changed) {
    const slots = []; S.days.forEach((x, i) => { if (x.month === S.period) slots.push(i); });
    slots.forEach((si, k) => { S.days[si] = order[k]; });
    save(); toast('Urutan hari disimpan');
  }
  renderLog();
}

    ${NOTE_F.map(([k, t]) => `<div class="sec"><h3>${t}</h3><textarea class="notes nf" data-k="${k}" placeholder="Tulis di sini…">${esc(N[k] || '')}</textarea></div>`).join('')}
    <div class="sec"><h3>Data di HP ini</h3>
      <p class="hint">${S.days.length} hari · ${nItems} aktivitas · <span id="nPh">… foto</span>. ${PWA ? 'Data hanya tersimpan di perangkat ini, jadi cadangkan rutin.' : 'Data tersinkron ke akun Claude-mu; cadangan JSON tetap disarankan sesekali.'}</p>
      <div class="grid2"><button type="button" class="btn" id="bBackup">Cadangkan</button>
      <div class="btn filebtn">Pulihkan<input type="file" id="bRestore" accept="application/json,.json" aria-label="Pulihkan dari file"></div></div>
      <div class="grid2" style="margin-top:8px"><button type="button" class="btn" id="bCopy">Salin kode data</button><button type="button" class="btn" id="bPaste">Tempel kode data</button></div>
      <p class="hint">Pindah ke HP/aplikasi lain tanpa file: tap Salin kode data di sini, lalu Tempel kode data di sana. Foto tidak ikut.</p>
      <p class="hint" id="bMsg"></p>
    </div>
    <div class="sec"><h3>Nama di header & PDF</h3>
      <div class="f"><input type="text" id="nName" value="${esc(S.name)}" style="width:100%;min-height:44px;border:1px solid var(--line2);border-radius:8px;padding:0 12px;background:var(--bg)"></div></div>
    <div class="sec"><h3>Arti kode tipe</h3>${Object.entries(TYPES).map(([k, t]) => `<div class="hint"><span class="tag T-${k}" style="display:inline-flex;align-items:center;min-height:24px">${k}</span> ${esc(t)}</div>`).join('')}</div>
    <div class="sec"><h3>Atur ulang</h3><p class="hint">Kembalikan ke data awal (${SEED.days.length} hari, ${SEED.days.reduce((a, d) => a + d.items.length, 0)} aktivitas). Data sekarang bisa diurungkan sesaat setelahnya.</p>
      <button type="button" class="btn danger" id="bReset">Atur ulang</button></div>`;
  { const e = $('#nPh'); if (e) e.textContent = S.days.reduce((a, d) => a + d.items.reduce((b, i) => b + i.imgs.length, 0), 0) + ' foto'; }
  v.querySelectorAll('.nf').forEach(t => t.oninput = () => {
    $('#nState').textContent = 'menyimpan…'; clearTimeout(noteT);
    noteT = setTimeout(() => { flushNote(); const st = $('#nState'); if (st) st.textContent = 'tersimpan otomatis'; }, 400);
  });
  $('#nName').onchange = e => { S.name = e.target.value.trim() || DEFAULT_NAME; save(); render(); toast('Nama disimpan'); };
  $('#bBackup').onclick = backup;
  $('#bCopy').onclick = async () => {
    flushNote();
    const ok = await copyText(JSON.stringify({app: 'activity-log', v: 1, exported: new Date().toISOString(), state: S}));
    $('#bMsg').textContent = ok ? `Kode data tersalin (${S.days.length} hari, ${S.days.reduce((a, d) => a + d.items.length, 0)} aktivitas). Buka aplikasi tujuan → Catatan → Tempel kode data.` : 'Gagal menyalin.';
  };
  $('#bPaste').onclick = () => {
    openSheet(`<h2>Tempel kode data</h2><div class="f"><textarea id="pasteTa" rows="6" placeholder="Tempel kode data di sini"></textarea></div>
      <p class="hint">Data di aplikasi ini akan diganti (bisa diurungkan sesaat).</p>
      <div class="acts"><button type="button" class="btn" id="pCancel2">Batal</button><button type="button" class="btn pri" id="pGo2">Pulihkan</button></div>`);
    $('#pCancel2').onclick = () => closeSheet();
    $('#pGo2').onclick = async () => {
      const t = $('#pasteTa').value.trim(); if (!t) return $('#pasteTa').focus();
      let data; try { data = JSON.parse(t); } catch (e) { toast('Kode tidak lengkap atau rusak, salin ulang'); return; }
      closeSheet(true); await restoreData(data);
    };
  };
  $('#bRestore').onchange = e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) restore(f); };
  $('#bReset').onclick = () => {
    if (!confirm('Atur ulang ke data awal?')) return;
    replaceState(seedState(), 'Data diatur ulang');
  };
}
const NOTE_F = [['hl', 'Highlight'], ['issue', 'Kendala / isu'], ['fu', 'Tindak lanjut']];
function flushNote() {
  const ts = document.querySelectorAll('#v-catatan .nf'); if (!ts.length || $('#v-catatan').hidden) return;
  clearTimeout(noteT);
  const old = S.notesM[S.period] || {}; const n = {hl: '', issue: '', fu: ''};
  ts.forEach(t => { n[t.dataset.k] = t.value; });
  if (n.hl === (old.hl || '') && n.issue === (old.issue || '') && n.fu === (old.fu || '')) return;
  if (n.hl || n.issue || n.fu) S.notesM[S.period] = n; else delete S.notesM[S.period];
  save();
}
function replaceState(ns, msg) {
  const prev = JSON.stringify(S);
  try { localStorage.setItem(KEY + '-sebelum', prev); } catch (e) {}
  ns.prefs = Object.assign({}, ns.prefs, {tab: S.prefs.tab});
  S = normalize(ns); save(); render();
  toast(msg, 'Urungkan', () => { S = normalize(JSON.parse(prev)); save(); render(); toast('Dikembalikan'); }, 9000);
}
async function backup() {
  const msg = $('#bMsg'); msg.textContent = 'Menyiapkan…';
  try {
    flushNote();
    const photos = {}; const ids = new Set(S.days.flatMap(d => d.items.flatMap(i => i.imgs)));
    let miss = 0;
    for (const id of ids) { try { const b = await getPhotoBlob(id); if (b) photos[id] = await blobToDataURL(b); else miss++; } catch (e) { miss++; } }
    const data = {app: 'activity-log', v: 1, exported: new Date().toISOString(), state: S, photos};
    const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
    const name = `activity-log-backup-${today()}.json`;
    await deliver(blob, name, 'application/json');
    msg.textContent = `Cadangan dibuat: ${Object.keys(photos).length} foto` + (miss ? `, ${miss} foto tidak ditemukan` : '') + '.';
  } catch (e) { msg.textContent = 'Gagal mencadangkan: ' + (e.message || e); }
}
async function restore(file) {
  const msg = $('#bMsg'); msg.textContent = 'Membaca file…';
  let data; try { data = JSON.parse(await file.text()); } catch (e) { msg.textContent = 'Gagal memulihkan: file rusak'; return; }
  return restoreData(data);
}
async function restoreData(data) {
  const msg = $('#bMsg') || {};
  try {
    const st = [data && data.state, data && data.data, data].find(x => x && Array.isArray(x.days));
    if (!st) throw new Error('Bukan file cadangan Activity Log');
    const n = st.days.reduce((a, d) => a + ((d.items || []).length), 0);
    if (!confirm(`Pulihkan ${st.days.length} hari dan ${n} aktivitas? Data sekarang diganti (bisa diurungkan sesaat).`)) { msg.textContent = ''; return; }
    st.updated = Date.now();
    let ok = 0, fail = 0;
    const ph = data.photos || data.imgs || data.images || {};
    const pairs = Array.isArray(ph) ? ph.map(p => [p.id || p.key, p.data || p.dataURL || p.src || p.blob]) : Object.entries(ph);
    for (const [id, u] of pairs) { try { const b = toBlob(u); if (!id || !b) throw 0; if (isLocal(id)) await idb.put(id, b); ok++; } catch (e) { fail++; } }
    replaceState(st, 'Data dipulihkan');
    const m2 = $('#bMsg'); if (m2) m2.textContent = `Dipulihkan: ${st.days.length} hari, ${n} aktivitas, ${ok} foto` + (fail ? `, ${fail} foto gagal` : '') + '.';
  } catch (e) { msg.textContent = 'Gagal memulihkan: ' + (e.message || e); }
}
async function deliver(blob, name, type) {
  if (downloadsNs) { try { await downloadsNs.save({filename: name, data: blob}); return 'save'; } catch (e) { if (e && (e.code === 'declined' || e.name === 'AbortError')) return 'abort'; } }
  const file = new File([blob], name, {type});
  if (navigator.canShare && navigator.share) {
    try { if (navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return 'share'; } }
    catch (e) { if (e && e.name === 'AbortError') return 'abort'; }
  }
  const u = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 30000);
  return 'download';
}

/* ================= PDF ================= */
function pdfSafe(s) {
  return String(s == null ? '' : s).replace(/[‘’‚′]/g, "'").replace(/[“”„″]/g, '"').replace(/[–—−]/g, '-').replace(/…/g, '...')
    .replace(/[•·]/g, '-').replace(/ /g, ' ').replace(/[^\x09\x0a\x0d\x20-\x7e\xa0-\xff]/g, '');
}
function pdfSheet() {
  const months = allMonths(); if (!months.includes(S.period)) months.push(S.period); months.sort();
  openSheet(`<h2>Ekspor PDF</h2>
    <div class="f"><label for="pM">Bulan</label><select id="pM">${months.map(m => `<option value="${m}"${m === S.period ? ' selected' : ''}>${esc(monthName(m))}</option>`).join('')}<option value="all">Semua bulan</option></select></div>
    <label class="chk"><input type="checkbox" id="pPh"> Sertakan foto</label>
    <label class="chk"><input type="checkbox" id="pEx" checked> Sertakan kontak &amp; catatan</label>
    <p class="hint" id="pMsg"></p>
    <div class="acts" id="pActs"><button type="button" class="btn" id="pCancel">Tutup</button><button type="button" class="btn pri" id="pGo">Buat PDF</button></div>`);
  $('#pCancel').onclick = () => closeSheet();
  $('#pGo').onclick = async () => {
    const msg = $('#pMsg'); const go = $('#pGo'); go.disabled = true; msg.textContent = 'Membuat PDF…';
    try {
      const opt = {month: $('#pM').value, photos: $('#pPh').checked, extras: $('#pEx').checked};
      const {doc, name} = await makePDF(opt, t => { msg.textContent = t; });
      const blob = doc.output('blob');
      msg.textContent = `Siap: ${name} (${Math.max(1, Math.round(blob.size / 1024))} KB, ${doc.getNumberOfPages()} hal).`;
      const canShare = !downloadsNs && !!(navigator.canShare && navigator.share && navigator.canShare({files: [new File([blob], name, {type: 'application/pdf'})]}));
      $('#pActs').innerHTML = `<button type="button" class="btn" id="pCancel">Tutup</button>${canShare ? '<button type="button" class="btn" id="pDl">Unduh</button><button type="button" class="btn pri" id="pShare">Bagikan / Simpan</button>' : '<button type="button" class="btn pri" id="pDl">Simpan PDF</button>'}`;
      $('#pCancel').onclick = () => closeSheet();
      $('#pDl').onclick = async () => {
        if (downloadsNs) { try { await downloadsNs.save({filename: name, data: blob}); msg.textContent = 'PDF tersimpan.'; } catch (e) { if (!(e && e.code === 'declined')) msg.textContent = 'Gagal menyimpan: ' + ((e && (e.code || e.message)) || e); } return; }
        const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 30000); };
      if ($('#pShare')) $('#pShare').onclick = async () => {
        try { await navigator.share({files: [new File([blob], name, {type: 'application/pdf'})], title: name}); }
        catch (e) { if (e.name !== 'AbortError') { msg.textContent = 'Bagikan gagal, pakai Unduh.'; } }
      };
    } catch (e) { msg.textContent = 'Gagal membuat PDF: ' + (e.message || e); go.disabled = false; }
  };
}
$('#pdfBtn').onclick = () => {
  if (!window.jspdf) return toast('Modul PDF belum termuat, coba lagi');
  pdfSheet();
};
function imgSize(u) {
  return new Promise(res => { const im = new Image(); const t = setTimeout(() => res({w: 4, h: 3}), 3000);
    im.onload = () => { clearTimeout(t); res({w: im.naturalWidth || 4, h: im.naturalHeight || 3}); };
    im.onerror = () => { clearTimeout(t); res({w: 4, h: 3}); }; im.src = u; });
}
async function makePDF(opt, progress) {
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit: 'mm', format: 'a4', compress: true});
  const W = 210, H = 297, M = 15, CW = W - 2 * M, BOTTOM = H - 16;
  const T = pdfSafe; let y = M;
  const all = opt.month === 'all';
  const months = all ? allMonths() : [opt.month];
  const perLabel = all ? (months.length ? monthName(months[0]) + ' - ' + monthName(months[months.length - 1]) : 'Semua') : monthName(opt.month);
  const items = months.flatMap(m => periodDays(m).flatMap(d => d.items));
  const ensure = h => { if (y + h > BOTTOM) { doc.addPage(); y = M; return true; } return false; };
  const SC = {'Pending': [120, 119, 116], 'On Progress': [11, 110, 153], 'Done': [15, 123, 108], 'Cancelled': [224, 62, 62]};
  const ink = () => doc.setTextColor(40, 40, 38);
  const mute = () => doc.setTextColor(120, 119, 116);

  // Kepala
  doc.setFont('helvetica', 'bold'); doc.setFontSize(20); ink(); doc.text('Activity Log', M, y + 6); y += 12;
  doc.setFontSize(11); doc.text(T(S.name), M, y); y += 5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); mute(); doc.text(ROLE, M, y); y += 5;
  doc.text(T('Periode: ' + perLabel + '   |   Dibuat: ' + dateLong(today())), M, y); y += 8;

  // Ringkasan status
  const boxes = [['Total', items.length, [40, 40, 38]], ...STATUS.map(s => [s, items.filter(i => i.st === s).length, SC[s]])];
  const bw = (CW - 4 * 3) / 5;
  boxes.forEach(([l, n, c], i) => {
    const x = M + i * (bw + 3);
    doc.setDrawColor(225, 225, 222); doc.setFillColor(247, 247, 245); doc.roundedRect(x, y, bw, 16, 2, 2, 'FD');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(...c); doc.text(String(n), x + 4, y + 8);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); mute(); doc.text(l, x + 4, y + 13);
  });
  y += 21;
  const tc = Object.keys(TYPES).map(t => [t, items.filter(i => i.type === t).length]).filter(x => x[1]);
  if (tc.length) {
    doc.setFontSize(9); mute();
    const lines = doc.splitTextToSize(T('Per tipe: ' + tc.map(([t, n]) => `${t} ${TYPES[t]} (${n})`).join(', ')), CW);
    doc.text(lines, M, y); y += lines.length * 4 + 3;
  }
  doc.setDrawColor(225, 225, 222); doc.line(M, y, W - M, y); y += 6;

  for (const m of months) {
    const days = periodDays(m);
    if (all) { ensure(16); doc.setFont('helvetica', 'bold'); doc.setFontSize(14); ink(); doc.text(monthName(m), M, y + 4); y += 10; }
    if (!days.length) { doc.setFont('helvetica', 'italic'); doc.setFontSize(10); mute(); doc.text('Tidak ada aktivitas.', M, y + 3); y += 8; }
    for (const d of days) {
      ensure(18);
      doc.setFillColor(241, 241, 239); doc.roundedRect(M, y, CW, 8, 1.5, 1.5, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); ink(); doc.text(T(dayTitle(d, true)), M + 3, y + 5.5);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); mute(); doc.text(d.items.length + ' aktivitas', W - M - 3, y + 5.5, {align: 'right'});
      y += 11;
      for (let k = 0; k < d.items.length; k++) {
        const it = d.items[k];
        doc.setFontSize(10); doc.setFont('helvetica', 'normal');
        const lines = doc.splitTextToSize(T(it.text), CW - 8);
        ensure(5 + lines.length * 4.6 + 2);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); mute();
        doc.text(T(`${k + 1}.  ${it.type} - ${TYPES[it.type] || it.type}${it.ch ? '  |  ' + it.ch : ''}`), M + 2, y);
        doc.setTextColor(...(SC[it.st] || SC.Pending)); doc.text(T(it.st), W - M - 2, y, {align: 'right'});
        y += 4.6;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(10); ink();
        for (const ln of lines) { ensure(5); doc.text(ln, M + 6, y); y += 4.6; }
        if (opt.photos && it.imgs.length) {
          progress && progress('Memuat foto…');
          let x = M + 6; const ph = 36; y += 1;
          let rowH = 0;
          for (const id of it.imgs) {
            let b; try { b = await getPhotoBlob(id); } catch (e) { b = null; }
            if (!b) continue;
            const u = await blobToDataURL(b); const sz = await imgSize(u);
            let w = ph * sz.w / sz.h; let h = ph; if (w > 56) { w = 56; h = w * sz.h / sz.w; }
            if (x + w > W - M) { x = M + 6; y += rowH + 2; rowH = 0; }
            if (ensure(h + 2)) x = M + 6;
            try { doc.addImage(u, 'JPEG', x, y, w, h, undefined, 'FAST'); } catch (e) {}
            x += w + 2; rowH = Math.max(rowH, h);
          }
          y += rowH + 1;
        }
        y += 2.4;
      }
      y += 2;
    }
    if (opt.extras) {
      const cs = contactsOf(m); const N = S.notesM[m] || {};
      if (cs.length) {
        ensure(14); doc.setFont('helvetica', 'bold'); doc.setFontSize(11); ink(); doc.text(T('Kontak - ' + monthName(m)), M, y + 3); y += 8;
        doc.setFontSize(9.5);
        for (const c of cs) {
          const line = [c.name + (c.org ? ' - ' + c.org : ''), c.inter, c.topic, c.follow ? 'Tindak lanjut: ' + c.follow : '', c.deadline ? 'Tenggat: ' + c.deadline : ''].filter(Boolean).join('  |  ');
          const ls = doc.splitTextToSize(T(line), CW - 4); ensure(ls.length * 4.4 + 1);
          doc.setFont('helvetica', 'normal'); ink(); doc.text(ls, M + 2, y); y += ls.length * 4.4 + 1;
        }
        y += 3;
      }
      if (hasNote(m)) {
        ensure(14); doc.setFont('helvetica', 'bold'); doc.setFontSize(11); ink(); doc.text(T('Catatan - ' + monthName(m)), M, y + 3); y += 8;
        for (const [k, t] of NOTE_F) {
          const val = (N[k] || '').trim(); if (!val) continue;
          ensure(10); doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); mute(); doc.text(t, M + 2, y); y += 4.2;
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); ink();
          for (const ln of doc.splitTextToSize(T(val), CW - 4)) { ensure(4.6); doc.text(ln, M + 2, y); y += 4.4; }
          y += 2;
        }
        y += 1;
      }
    }
  }
  const n = doc.getNumberOfPages();
  for (let p = 1; p <= n; p++) {
    doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); mute();
    doc.text(T(S.name + ' - Activity Log ' + perLabel), M, H - 8);
    doc.text(`Hal ${p} / ${n}`, W - M, H - 8, {align: 'right'});
  }
  const name = 'Activity-Log_' + (all ? 'Semua' : opt.month) + '.pdf';
  return {doc, name};
}

/* ================= Navigasi ================= */
function setPeriod(m) { if (!isMonth(m)) return; flushNote(); closeSwipe(); S.period = m; save(); render(); window.scrollTo(0, 0); }
$('#prevM').onclick = () => setPeriod(shiftMonth(S.period, -1));
$('#nextM').onclick = () => setPeriod(shiftMonth(S.period, 1));
$('#perIn').onchange = e => setPeriod(e.target.value);
$('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; flushNote(); S.prefs.tab = b.dataset.tab; save(); render(); window.scrollTo(0, 0); };
document.addEventListener('visibilitychange', () => { if (document.hidden) flushNote(); });
window.addEventListener('pagehide', flushNote);

/* ================= Mulai ================= */
S = load(); lsSave(); render();
initCloud();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if (PWA && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
